[package]
name = "tip_router"
version = "0.1.0"
description = "Featherpay TipRouter Soroban contract: routes every tip on Featherpay"
repository = "https://github.com/featherpay/contracts"
readme = "README.md"
license = "MIT"
edition = "2021"
rust-version = "1.74"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=28.0.0"

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "s"
overflow-checks = true
lto = true
codegen-units = 1